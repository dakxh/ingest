name: pipeline

on:
  workflow_dispatch:
    inputs:
      target_link:
        description: 'Direct link to payload (Drive, Torrent, Magnet)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  process-queue:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free Up Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install Dependencies
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          
          sudo apt-get update && sudo apt-get install -y ffmpeg mkvtoolnix libcurl4-openssl-dev jq unzip unrar cloudflare-warp
          pip install -U --break-system-packages pyrofork tgcrypto guessit requests google-auth tqdm
          
      - name: Acknowledge Payload
        id: payload_ack
        run: |
          echo "Target acquired: ${{ inputs.target_link }}"
          echo "TARGET_LINK=${{ inputs.target_link }}" >> $GITHUB_ENV
          echo "found=true" >> $GITHUB_ENV

      - name: Download and Extract Payload
        if: env.found == 'true'
        env:
          GCP_SA_JSON: ${{ secrets.GCP_SA_JSON }}
        run: |
          mkdir -p workspace
          echo "Evaluating Payload Type..."

          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos connect

          for i in {1..12}; do
            if curl -s -x socks5://127.0.0.1:40000 https://cloudflare.com/cdn-cgi/trace | grep -q "warp=on"; then break; fi
            sleep 5
          done

          IS_TORRENT=false
          if [[ "$TARGET_LINK" == magnet:* ]] || [[ "$TARGET_LINK" == *.torrent* ]]; then IS_TORRENT=true; fi

          if [[ "$TARGET_LINK" == *drive.google.com* ]] || [[ "$TARGET_LINK" == *drive.usercontent.google.com* ]]; then
            if [[ "$TARGET_LINK" == *\&at=* ]] || [[ "$TARGET_LINK" == *confirm=t* ]]; then
              cd workspace && curl -# -L -OJ "$TARGET_LINK" && cd ..
            else
              cat << 'EOF' > gdrive_sa_dl.py
          import os, sys, re, json, requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request
          from tqdm import tqdm
          link, sa_json_str = sys.argv[1], os.environ.get('GCP_SA_JSON')
          if not sa_json_str: sys.exit(1)
          sa_info = json.loads(sa_json_str)
          creds = service_account.Credentials.from_service_account_info(sa_info, scopes=['https://www.googleapis.com/auth/drive.readonly'])
          creds.refresh(Request())
          headers = {'Authorization': f'Bearer {creds.token}'}
          match = re.search(r'(id=|/d/|folders/)([a-zA-Z0-9_-]+)', link)
          file_id = match.group(2)
          def download_file(fid, fname):
              url = f"https://www.googleapis.com/drive/v3/files/{fid}?alt=media"
              with requests.get(url, headers=headers, stream=True) as r:
                  total_size = int(r.headers.get('Content-Length', 0))
                  with open(os.path.join("workspace", fname), 'wb') as f:
                      with tqdm(total=total_size, unit='iB', unit_scale=True, desc=fname[:30], ascii=True) as pbar:
                          for chunk in r.iter_content(chunk_size=1024*1024*10):
                              if chunk: f.write(chunk); pbar.update(len(chunk))
          def process_node(fid):
              res = requests.get(f"https://www.googleapis.com/drive/v3/files/{fid}?fields=name,mimeType", headers=headers).json()
              if res.get('mimeType') == 'application/vnd.google-apps.folder':
                  children = requests.get(f"https://www.googleapis.com/drive/v3/files?q='{fid}'+in+parents+and+trashed=false", headers=headers).json().get('files', [])
                  for child in children: process_node(child['id'])
              else: download_file(fid, res['name'])
          process_node(file_id)
          EOF
              python gdrive_sa_dl.py "$TARGET_LINK"
            fi

          elif [[ "$IS_TORRENT" == "false" ]] && [[ "$TARGET_LINK" == http* ]]; then
            HEADERS=$(curl -g -sIL -x socks5h://127.0.0.1:40000 -H 'User-Agent: Mozilla/5.0' "$TARGET_LINK" || true)
            SERVER_FILENAME=$(python3 -c "import sys, re, urllib.parse; h=sys.stdin.read(); m=re.search(r'(?i)filename\*?=(?:\"?UTF-8\'\'\"?)?([^\r\n;]+)', h); print(urllib.parse.unquote(m.group(1).strip(' \"\'')) if m else 'Direct_Payload.mkv')" <<< "$HEADERS")
            wget -qO yt-dlp https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux && chmod +x yt-dlp
            ./yt-dlp --proxy "socks5://127.0.0.1:40000" --add-header 'User-Agent: Mozilla/5.0' -N 16 -o "workspace/$SERVER_FILENAME" "$TARGET_LINK"

          else
            wget -qO qbittorrent-nox https://github.com/userdocs/qbittorrent-nox-static/releases/latest/download/x86_64-qbittorrent-nox
            chmod +x qbittorrent-nox
            mkdir -p ~/.config/qBittorrent
            cat << EOF_CONF > ~/.config/qBittorrent/qBittorrent.conf
          [Preferences]
          WebUI\Port=8085
          WebUI\AuthSubnetWhitelistEnabled=true
          WebUI\AuthSubnetWhitelist=127.0.0.1/32, ::1/128
          WebUI\LocalHostAuth=false
          Downloads\SavePath=$(pwd)/workspace/
          # Aggressive NAT piercing & Proxy forcing
          BitTorrent\Session\MaxConnections=500
          BitTorrent\Session\Encryption=1
          BitTorrent\Session\DHT=true
          BitTorrent\Session\PeX=true
          BitTorrent\Session\LSD=false
          Network\Port=443
          Proxy\Type=2
          Proxy\IP=127.0.0.1
          Proxy\Port=40000
          Proxy\Enabled=true
          Proxy\PeerExchange=true
          Proxy\OnlyForTorrents=false
          EOF_CONF
            ./qbittorrent-nox -d --confirm-legal-notice
            cat << 'EOF_PY' > qbit_monitor.py
          import time, requests, sys
          target_link, base_url = sys.argv[1], "http://127.0.0.1:8085/api/v2"
          for _ in range(30):
              try: requests.get(f"{base_url}/app/version"); break
              except: time.sleep(1)
          requests.post(f"{base_url}/torrents/add", data={'urls': target_link})
          start_t, last_p = time.time(), -1
          while True:
              try:
                  torrents = requests.get(f"{base_url}/torrents/info").json()
                  if not torrents: 
                      if time.time() - start_t > 60: sys.exit(1)
                      time.sleep(2); continue
                  t = torrents[0]
                  if t.get('progress', 0) > last_p: start_t, last_p = time.time(), t.get('progress')
                  if t.get('progress') == 1.0 or t.get('state') in ['uploading', 'stalledUP']: break
                  if time.time() - start_t > 600: sys.exit(1)
                  time.sleep(5)
              except: time.sleep(2)
          EOF_PY
            python3 qbit_monitor.py "$TARGET_LINK"
            curl -s -X POST http://127.0.0.1:8085/api/v2/app/shutdown || true
            rm qbittorrent-nox
          fi
          warp-cli --accept-tos disconnect

          find workspace -type f -name "*.zip" -exec unzip -q -o {} -d workspace/ \; -exec rm {} \;
          while read -u 9 RAR; do
            unrar e -y "$RAR" workspace/ || true
            DIR=$(dirname "$RAR")
            rm -f "$DIR"/*.rar "$DIR"/*.r[0-9][0-9] "$DIR"/*.sfv "$DIR"/*.nfo
          done 9< <(find workspace -type f -name "*.rar")

      - name: Optimize, Probe, Split, and Upload
        if: env.found == 'true'
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          # 1. Locate the exact downloaded file
          VIDEO_FILE=$(find workspace -type f \( -name "*.mkv" -o -name "*.mp4" \) | head -n 1)
          if [ -z "$VIDEO_FILE" ]; then echo "❌ No video file found."; exit 1; fi
          
          echo "🎬 Processing: $VIDEO_FILE"
          EXT="${VIDEO_FILE##*.}"
          
          # 2. Optimize Container (Preserving the original filename!)
          if [ "${EXT,,}" == "mp4" ]; then
            ffmpeg -v error -i "$VIDEO_FILE" -c copy -movflags +faststart "workspace/optimized_temp.mp4"
            mv "workspace/optimized_temp.mp4" "$VIDEO_FILE"
          elif [ "${EXT,,}" == "mkv" ]; then
            mkvpropedit "$VIDEO_FILE" --tags all: --add-track-statistics-tags
          fi
          
          # 3. Split into 1.8GB Chunks
          echo "✂️ Slicing into 1.8GB Chunks..."
          mkdir -p chunks
          split -b 1800M "$VIDEO_FILE" "chunks/chunk_"
          
          # 4. Generate the Python Script
          cat << 'EOF_PY' > process_and_upload.py
          import os, sys, re, json, asyncio, subprocess
          from guessit import guessit
          import requests
          from pyrogram import Client

          api_id = os.environ.get('TG_API_ID')
          api_hash = os.environ.get('TG_API_HASH')
          bot_token = os.environ.get('TG_BOT_TOKEN')
          chat_id = int(os.environ.get('TG_CHAT_ID'))
          tmdb_key = os.environ.get('TMDB_API_KEY')

          video_file = sys.argv[1]
          filename = os.path.basename(video_file)

          # --- A. Aggressive Filename Sanitization ---
          g = guessit(filename)
          raw_title = str(g.get('title', 'Unknown')).strip()
          year = str(g.get('year', ''))
          vid_type = 'tv' if g.get('season') else 'movie'

          year_matches = list(re.finditer(r'(?:\b|\()((?:19|20)\d{2})(?:\b|\))', filename))
          if year_matches:
              last_year_match = year_matches[-1]
              year = last_year_match.group(1)
              raw_prefix = filename[:last_year_match.start()]
              raw_prefix = re.split(r'(?i)[ _.-]+(?:S\d{1,2}E\d{1,4}|S\d{1,2}|Season\s?\d{1,2}|E\d{1,4})\b', raw_prefix)[0]
              regex_title = re.sub(r'^\[.*?\]\s*', '', raw_prefix).replace('.', ' ').strip(' -_()[]')
              clean_title = regex_title if (len(regex_title) > 2 and regex_title.lower() != 'unknown') else raw_title
          else:
              clean_title = raw_title

          # --- B. FFprobe Probing ---
          quality = 'Unknown'
          audio_langs = set()
          subtitles = []

          try:
              cmd = ['ffprobe', '-v', 'error', '-show_streams', '-of', 'json', video_file]
              res = subprocess.run(cmd, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)
              probe_data = json.loads(res.stdout)
              
              for stream in probe_data.get('streams', []):
                  codec_type = stream.get('codec_type')
                  tags = stream.get('tags', {})
                  lang = tags.get('language', 'und')
                  
                  if codec_type == 'video':
                      height = stream.get('height', 0)
                      if height >= 2160: quality = '2160p'
                      elif height >= 1080: quality = '1080p'
                      elif height >= 720: quality = '720p'
                      else: quality = 'SD'
                  elif codec_type == 'audio':
                      audio_langs.add(lang)
                  elif codec_type == 'subtitle':
                      subtitles.append({'language': lang, 'codec': stream.get('codec_name', 'unknown')})
          except Exception as e:
              print(f"FFprobe extraction failed: {e}")

          visual_tags = []
          if bool(re.search(r'(hdr|dovi|\bdv\b)', filename.lower())): visual_tags.append('HDR')
          if 'imax' in filename.lower(): visual_tags.append('IMAX')
          visual_tags_str = ",".join(visual_tags) if visual_tags else None

          # --- C. TMDB API Resolution ---
          media_id, final_title = None, clean_title
          overview, poster, backdrop, rating, genres = None, None, None, 0.0, None

          if tmdb_key and clean_title != 'Unknown':
              search_type = 'tv' if vid_type == 'tv' else 'movie'
              search_url = f'https://api.themoviedb.org/3/search/{search_type}?api_key={tmdb_key}&query={clean_title}'
              if year: search_url += f'&year={year}' if search_type == 'movie' else f'&first_air_date_year={year}'
              
              try:
                  res = requests.get(search_url).json()
                  if res.get('results'):
                      match = res['results'][0]
                      media_id = str(match.get('id'))
                      final_title = match.get('name' if vid_type == 'tv' else 'title', clean_title)
              except Exception as e:
                  print(f"TMDB fetch failed: {e}")

          if not media_id: 
              media_id = re.sub(r'[^a-z0-9]', '', f"{clean_title.lower()}{year}")

          # --- D. Telegram Upload Phase ---
          async def upload_chunks():
              app = Client("tg_uploader", api_id=api_id, api_hash=api_hash, bot_token=bot_token)
              await app.start()
              
              chunk_files = sorted([f for f in os.listdir('chunks') if f.startswith('chunk_')])
              tg_chunks = []
              start_byte = 0
              
              print(f"🚀 Uploading {len(chunk_files)} chunks to Telegram...")
              for i, chunk in enumerate(chunk_files):
                  chunk_path = os.path.join('chunks', chunk)
                  chunk_size = os.path.getsize(chunk_path)
                  end_byte = start_byte + chunk_size - 1
                  
                  print(f"📤 Uploading Part {i} ({chunk_size} bytes)...")
                  msg = await app.send_document(chat_id, chunk_path, file_name=f"{media_id}_part{i}.bin")
                  
                  tg_chunks.append({
                      "chunk_index": i,
                      "message_id": msg.id,
                      "file_id": msg.document.file_id,
                      "start_byte": start_byte,
                      "end_byte": end_byte,
                      "size": chunk_size
                  })
                  start_byte += chunk_size
                  os.remove(chunk_path)
              
              await app.stop()
              return tg_chunks

          loop = asyncio.get_event_loop()
          tg_chunks = loop.run_until_complete(upload_chunks())

          # --- E. Generate d1_payloads.json ---
          payload = {
              "media_id": media_id,
              "title": final_title,
              "year": year,
              "type": vid_type,
              "quality": quality,
              "visual_tags": visual_tags_str,
              "audio_languages": json.dumps(list(audio_langs)) if audio_langs else '["und"]',
              "subtitles": json.dumps(subtitles) if subtitles else "[]",
              "container": filename.split('.')[-1].lower(),
              "chunks": tg_chunks
          }

          if vid_type == 'tv':
              payload['season'] = g.get('season')
              payload['episode'] = g.get('episode')

          with open('d1_payloads.json', 'w') as f:
              json.dump([payload], f, indent=4)
          print("✅ Payload generated successfully.")
          EOF_PY

          # 5. Execute Python with the actual video file present!
          python3 process_and_upload.py "$VIDEO_FILE"
          
          # 6. Safely delete the original file to free up runner space
          echo "🗑️ Cleaning up original file..."
          rm "$VIDEO_FILE"

      - name: Sync Metadata to Cloudflare D1
        if: env.found == 'true' && success()
        env:
          CF_WORKER_URL: ${{ secrets.CF_WORKER_URL }}
        run: |
          if [ -f "d1_payloads.json" ]; then
            echo "🔍 Validating D1 payload schema..."
            jq . d1_payloads.json > /dev/null
            
            echo "🚀 Sending payload array to Cloudflare Edge..."
            HTTP_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST -H "Content-Type: application/json" -d @d1_payloads.json "${CF_WORKER_URL%/}/api/ingest")
            
            HTTP_STATUS=$(echo "$HTTP_RESPONSE" | tail -n1)
            BODY=$(echo "$HTTP_RESPONSE" | sed '$d')
            
            if [ "$HTTP_STATUS" -ge 400 ]; then
              echo "❌ D1 Ingestion failed! Status: $HTTP_STATUS"
              echo "Detail: $BODY"
              exit 1
            fi
            echo "✅ D1 Database Sync completed successfully."
          fi
